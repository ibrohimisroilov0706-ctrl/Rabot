# .github/workflows/ci.yml
# Har push/PR: tiplar, qoida testlari, haqiqiy PostgreSQL bilan integratsiya testlari, build.
# main ga push: testlar yashil bo'lsa -> serverga avtomatik deploy (Secrets sozlangan bo'lsa).
#
# Kerakli GitHub Secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SSH_HOST            server IP manzili (masalan 203.0.113.7)
#   SSH_PASSWORD        server root paroli  (yoki SSH_PRIVATE_KEY)
#   TELEGRAM_BOT_TOKEN  @BotFather bergan token
# Ixtiyoriy: SSH_USER (standart root), SSH_PORT (22), SSH_PRIVATE_KEY, DOMAIN (o'z domeningiz)
name: CI va Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qirolliklar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -w @qirolliklar/game-rules
      - run: npm test -w @qirolliklar/server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/qirolliklar_test
      - run: npm run build

  # Oflayn o'yin (serversiz): har push'da play/ ga build qilinadi va GitHub Pages orqali ochiladi:
  # https://<login>.github.io/<repo>/play/
  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Oflayn o'yinni build qilish
        working-directory: apps/client
        env:
          VITE_OFFLINE: '1'
        run: npx vite build --base ./ --outDir ../../play --emptyOutDir
      - name: play/ ni GitHub Pages uchun commit qilish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -m "play: oflayn o'yin build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DOMAIN: ${{ secrets.DOMAIN }}
    steps:
      - name: Secrets tekshiruvi
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$TELEGRAM_BOT_TOKEN" ] || { [ -z "$SSH_PASSWORD" ] && [ -z "$SSH_PRIVATE_KEY" ]; }; then
            echo "::warning::Deploy o'tkazib yuborildi: SSH_HOST, TELEGRAM_BOT_TOKEN va SSH_PASSWORD (yoki SSH_PRIVATE_KEY) Secrets ga qo'shilmagan"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: SSH tayyorlash
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            echo "SSH=ssh -p $SSH_PORT -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "SSH=sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
            echo "SSHPASS=$SSH_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Kodni serverga yuborish
        if: steps.check.outputs.ok == 'true'
        run: |
          tar czf /tmp/app.tgz --exclude=.git --exclude=node_modules --exclude='*/node_modules' --exclude='*/dist' .
          $SSH "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/qirolliklar && cat > /tmp/app.tgz' < /tmp/app.tgz
          $SSH "$SSH_USER@$SSH_HOST" 'tar xzf /tmp/app.tgz -C /opt/qirolliklar && rm /tmp/app.tgz'
      - name: Serverda ishga tushirish
        if: steps.check.outputs.ok == 'true'
        run: |
          $SSH "$SSH_USER@$SSH_HOST" \
            "cd /opt/qirolliklar && TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' DOMAIN='$DOMAIN' HOST_IP='$SSH_HOST' bash deploy/server-deploy.sh"
