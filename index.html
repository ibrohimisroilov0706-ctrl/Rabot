<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a13" />
  <meta name="description" content="Rabot — 3D virtual planeta. Aylantiring, yaqinlashtiring va hududlarni kashf eting." />
  <title>Rabot — virtual planeta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js CDN orqali (versiya qotirilgan) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Rabot planetasi, 3D ko'rinish"></canvas>
  <div id="labels"></div>

  <header class="brand">
    <h1>Rabot</h1>
    <p>Virtual planeta, prototip 0.1</p>
  </header>

  <div class="tools">
    <button id="btnAuto" type="button" aria-pressed="true" aria-label="Avto aylanish" title="Avto aylanish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button id="btnReset" type="button" aria-label="Boshlang'ich ko'rinish" title="Boshlang'ich ko'rinish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </div>

  <p id="hint" class="hint">Aylantirish uchun sudrang. Yaqinlashtirish uchun ikki barmoq bilan cho'zing yoki g'ildirakni buring.</p>

  <aside id="panel" class="panel" aria-live="polite">
    <button id="panelClose" class="close" type="button" aria-label="Yopish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p id="pKind" class="kind"></p>
    <h2 id="pName"></h2>
    <p id="pDesc" class="desc"></p>
    <dl id="pFacts" class="facts"></dl>
  </aside>

  <nav id="chips" class="chips" aria-label="Hududlar"></nav>

  <div id="loader" class="loader">
    <div class="loader-inner">
      <div class="loader-brand">Rabot</div>
      <div class="loader-track"><div id="bar" class="loader-bar"></div></div>
      <p id="loaderText">Planeta yaratilmoqda...</p>
    </div>
  </div>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Rabot ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</p></noscript>

  <script type="module" src="main.js"></script>
</body>
</html>
