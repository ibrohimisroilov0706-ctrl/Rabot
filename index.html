function lifeStep(dt){

else{av.rig.rotation.x+=(0-av.rig.rotation.x)*Math.min(1,dt*8);const a=P.gr?sw:0;av.legs[0].rotation.x=P.gr?sw:.6;av.legs[1].rotation.x=P.gr?-sw:-.3;av.arms[0].rotation.x=P.gr?-sw:-2.4;av.arms[1].rotation.x=P.gr?sw:-2.4}

for(let i=0;i<RN;i++){let y=a.getY(i)-sp2*dt;if(y<-15)y=15;a.setY(i,y)}a.needsUpdate=true}
