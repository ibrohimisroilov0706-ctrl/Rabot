# docker-compose.yml — bitta VPS uchun: PostgreSQL + o'yin serveri + Caddy (avtomatik HTTPS) + kunlik backup.
# Avtomatik: GitHub'ga push -> .github/workflows/ci.yml -> deploy/server-deploy.sh.
# Qo'lda: cp .env.example .env && nano .env && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qirolliklar
      POSTGRES_USER: qirolliklar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da bo'lishi kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # faqat lokal kompyuterdan (dev uchun); internetga ochilmaydi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qirolliklar -d qirolliklar"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://qirolliklar:${POSTGRES_PASSWORD}@db:5432/qirolliklar
    ports:
      - "127.0.0.1:8080:8080"   # tashqariga faqat Caddy orqali (HTTPS)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Kunlik zaxira nusxa (backup): ./backups ga, 14 kun saqlanadi
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U qirolliklar -Fc qirolliklar > /backups/qirolliklar-$$(date +%F-%H%M).dump && find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
